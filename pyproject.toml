[project]
name = "myrios"
version = "0.1.0"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
extend-exclude = ["artifacts", "paper/tmlr", "*.ipynb"]

[tool.ruff.lint]
select = ["F", "E9", "E7"]
ignore = ["E402"]
